# ⚠️  LOS CUATRO GRUPOS DEL OPERADOR LLEVAN VALORES SINTÉTICOS ⚠️
#
# `googleDrive`, `registry`, `terminals` y `backupRepository` NO son
# credenciales reales: se sellaron el 2026-09-10 con la cadena
# "SINTETICO-NO-SIRVE-cluster-de-entrenamiento-2026-09-10" para que el chart
# renderice y el tenant arranque en el cluster de ENTRENAMIENTO.
#
# QUÉ SIGNIFICA ESO, SIN ADORNOS: este tenant vende, pero NO respalda a Google
# Drive, NO habla con el Registro de catálogo, NO copia al repositorio central
# de respaldos, y NO tiene ningún terminal autorizado. Los cuatro apuntan a
# credenciales que no sirven, y fallarán en cuanto algo las use de verdad.
#
# Los tres grupos que sí son reales —`database`, `objectStorage` y `seed`— los
# escribió el propio Control Plane al dar de alta el tenant, sellados contra la
# clave del cluster. Esos sí valen.
#
# ANTES DE QUE ESTE TENANT SIRVA A NADIE, un Operador resella los cuatro con
# credenciales reales (infrastructure/docs/poner-en-marcha-el-cluster.md §7).
sealedSecrets:
  backupRepository:
    BACKUP_REPOSITORY_ACCESS_KEY: 
    BACKUP_REPOSITORY_SECRET_KEY: 
  database:
    BREKAN_APP_PASSWORD: 
    BREKAN_MIGRATOR_PASSWORD: 
    DB_PASS: 
    FLYWAY_PASSWORD: 
    FLYWAY_URL: 
    POSTGRES_PASSWORD: 
    R2DBC_URL: 
  googleDrive:
    GOOGLE_DRIVE_CLIENT_ID: 
    GOOGLE_DRIVE_CLIENT_SECRET: 
    GOOGLE_DRIVE_FOLDER_ID: 
    GOOGLE_DRIVE_REFRESH_TOKEN: 
  objectStorage:
    MINIO_ACCESS_KEY: 
    MINIO_BACKUP_ACCESS_KEY: 
    MINIO_BACKUP_SECRET_KEY: 
    MINIO_ROOT_PASSWORD: 
    MINIO_ROOT_USER: 
    MINIO_SECRET_KEY: 
  registry:
    BREKAN_REGISTRY_TOKEN: 
  seed:
    BREKAN_SEED_ADMIN_PASSWORD_HASH: 
  terminals:
    BREKAN_TERMINAL_TOKENS: 

tenant:
  slug: "donjuan"
  displayName: "DonJuan"
  subdomain: "donjuan"
  vertical: "panaderia"
placement:
  targetCluster: "in-cluster"
database:
  name: "brekan_pos"
  storage: "10Gi"
  resources: { cpu: "500m", memory: "512Mi" }
objectStorage:
  dataBucket: "brekan-pos-uploads"
  backupBucket: "brekan-pos-backups"
  storage: "20Gi"
backend:
  image: "ghcr.io/bobsuarez/pos-backend:0.1.1"
  replicas: 1
  maxReplicas: 1
  resources: { cpu: "500m", memory: "768Mi" }
backup:
  mode: "logical-hourly"
  schedule: "55 * * * *"
  localRetentionHours: 48
  offNodeRetentionDays: 30
  integrityCheckSchedule: "15 6 * * *"
  googleDriveSecretRef: "tenant-donjuan-gdrive"
secretsRef:
  database: "tenant-donjuan-db"
  objectStorage: "tenant-donjuan-minio"
seed:
  currency: "COP"
  timezone: "America/Bogota"
  roundingStepMinor: 5000
  adminUsername: "admin"
resolutions: []
terminals: []

license:
  status: "active"

entitlements:
  contractedSurface: "both"
  modules:
    - venta
    - productos
    - inventario
    - clientes
    - reportes
    - analitica
    - promos
    - ia
    - turnos
    - dian
    - finanzas
    - proveedores
    - usuarios
capacity:
  declaredTransactionsPerHour: 1
  tier: "small"

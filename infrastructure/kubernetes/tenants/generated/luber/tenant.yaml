tenant:
  slug: "luber"
  displayName: "Luber"
  subdomain: "luber"
  vertical: "bicicleteria"
placement:
  targetCluster: "vps-contabo-tenant-1"
database:
  name: "brekan_pos"
  storage: "30Gi"
  resources: { cpu: "500m", memory: "512Mi" }
objectStorage:
  dataBucket: "brekan-pos-uploads"
  backupBucket: "brekan-pos-backups"
  storage: "20Gi"
backend:
  image: "ghcr.io/bobsuarez/pos-backend:0.1.22"
  replicas: 1
  maxReplicas: 1
  resources: { cpu: "500m", memory: "768Mi" }
backup:
  mode: "logical-hourly"
  schedule: "58 * * * *"
  localRetentionHours: 24
  offNodeRetentionDays: 30
  integrityCheckSchedule: "15 6 * * *"
  googleDriveSecretRef: "tenant-luber-gdrive"
secretsRef:
  database: "tenant-luber-db"
  objectStorage: "tenant-luber-minio"
seed:
  currency: "COP"
  timezone: "America/Bogota"
  roundingStepMinor: 5000
  adminUsername: "admin"
resolutions:
  - number: "1234567800"
    prefix: "LUB"
    rangeStart: 1
    rangeEnd: 5000
    validFrom: 2026-10-16
    validUntil: 2026-10-31
terminals:
  - code: "CAJA-01"
    displayName: "Caja principal"
    location: "Principal"
    numbering:
      resolution: "1234567800"
      prefix: "LUB"
      rangeStart: 1
      rangeEnd: 5000

license:
  status: "active"

entitlements:
  contractedSurface: "both"
  modules:
    - venta
    - productos
    - inventario
    - clientes
    - reportes
    - analitica
    - promos
    - ia
    - turnos
    - dian
    - finanzas
    - proveedores
    - usuarios
  verticalModule: "gym"
capacity:
  declaredTransactionsPerHour: 1
  tier: "small"
locations:
  - name: "Principal"
  - name: "Libertad"
  - name: "Usme"

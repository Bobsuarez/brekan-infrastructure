tenant:
  slug: "tiendaprueba"
  displayName: "tiendaprueba"
  subdomain: "tiendaprueba"
  vertical: "cigarreria"
placement:
  targetCluster: "in-cluster"
database:
  name: "brekan_pos"
  storage: "10Gi"
  resources: { cpu: "500m", memory: "512Mi" }
objectStorage:
  dataBucket: "brekan-pos-uploads"
  backupBucket: "brekan-pos-backups"
  storage: "20Gi"
backend:
  image: "ghcr.io/bobsuarez/pos-backend:0.1.2"
  replicas: 1
  maxReplicas: 1
  resources: { cpu: "500m", memory: "768Mi" }
backup:
  mode: "logical-hourly"
  schedule: "40 * * * *"
  localRetentionHours: 48
  offNodeRetentionDays: 30
  integrityCheckSchedule: "15 6 * * *"
  googleDriveSecretRef: "tenant-tiendaprueba-gdrive"
secretsRef:
  database: "tenant-tiendaprueba-db"
  objectStorage: "tenant-tiendaprueba-minio"
seed:
  currency: "COP"
  timezone: "America/Bogota"
  roundingStepMinor: 5000
  adminUsername: "admin"
resolutions:
  - number: "100000000"
    prefix: "SJH"
    rangeStart: 1
    rangeEnd: 10000
    validFrom: 2026-09-14
    validUntil: 2026-11-10
terminals:
  - code: "CAJA-01"
    displayName: "Caja principal"
    location: "Principal"
    numbering:
      resolution: "100000000"
      prefix: "SJH"
      rangeStart: 1
      rangeEnd: 10000

license:
  status: "active"

entitlements:
  contractedSurface: "both"
  modules:
    - venta
    - productos
    - inventario
    - clientes
    - reportes
    - analitica
    - promos
    - ia
    - turnos
    - dian
    - finanzas
    - proveedores
    - usuarios
capacity:
  declaredTransactionsPerHour: 1
  tier: "small"

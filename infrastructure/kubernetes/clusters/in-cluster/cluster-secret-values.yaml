# infrastructure/kubernetes/clusters/in-cluster/cluster-secret-values.yaml
#
# Archivo de CREDENCIALES del cluster "in-cluster" (ADR-471, ADR-469
# cláusula 4). Archivo HERMANO de cluster-values.yaml — mismo directorio,
# NO consumido por el mismo camino: cluster-values.yaml es la PRIMERA
# fuente de valores del chart del tenant; este es la CUARTA (desde el
# requerimiento 71, 71C-infrastructure-03).
#
# NO ES UN OBJETO DE KUBERNETES: sin apiVersion, sin kind y sin metadata,
# misma forma que cluster-values.yaml y que sealed-values.yaml (ADR-108).
#
# QUÉ HAY HOY, Y POR QUÉ SOLO ESTO: "in-cluster" es el servidor de
# administración, y ArgoCD conoce su propio cluster sin que nadie se lo
# diga — no lleva `Secret` de cluster (ver kubernetes/base/fleet/,
# 71C-infrastructure-02, paso 1: "in-cluster no lleva Secret. El chart lo
# salta explícitamente"). Por eso este archivo NO trae la clave `argocd`
# que sí llevará el de cualquier OTRO cluster del parque (ADR-469 cláusula
# 4) — aquí no hay bearerToken que sellar.
#
# Lo que SÍ trae, y por lo que este archivo existe a partir de esta tarea:
# `pushgatewayAuth`, la credencial que el chart del TENANT (no el del
# parque) consume para autenticar backup.sh contra el Pushgateway
# publicado (ADR-473 cláusula 2). Se declara AQUÍ TAMBIÉN, aunque en el
# hub el Pushgateway sea interno y no exija credencial en runtime, porque
# `sealed-secrets.yaml` la exige con `required` SIN condición — el
# ciphertext tiene que existir en TODO cluster (ver el comentario del
# octavo SealedSecret en tenant-template/templates/sealed-secrets.yaml
# para el porqué completo). Sellar una cadena VACÍA sigue produciendo un
# ciphertext real y no vacío (RSA-OAEP+AES-GCM nunca cifra a cero bytes),
# así que esto NO relaja `required` ni le da un valor por defecto oculto:
# es la MISMA regla, aplicada con un valor en claro que resulta ser "".
#
# ESTE VALOR, IGUAL QUE EL DE generated/staging/sealed-values.yaml, NO ES
# CIPHERTEXT REAL — se generó sin `kubeseal` ni acceso a un cluster (misma
# limitación de entorno que infrastructure/CLAUDE.md ya documenta). Antes
# de que cualquier tenant del hub complete un respaldo contra el
# Pushgateway publicado, un Operador con acceso al cluster tiene que
# resellar esta clave de verdad:
#
#   printf '' | kubeseal --raw \
#     --controller-namespace kube-system \
#     --namespace tenant-<slug-de-CADA-tenant-del-hub> \
#     --name tenant-<slug>-pushgateway-auth \
#     --from-file=/dev/stdin
#
# NOTA IMPORTANTE SOBRE EL COMANDO DE ARRIBA, CORREGIDA TRAS LA REVISIÓN DE
# CÓDIGO (B3, requerimiento 71): el ciphertext de un SealedSecret sellado
# con `kubeseal --raw` a secas (sin `--scope`) queda ligado a
# namespace+nombre del Secret DESTINO —igual que sealed-values.yaml, ver
# infrastructure/docs/poner-en-marcha-el-cluster.md §7—, y ESTE valor es
# ÚNICO POR CLUSTER, mientras que sealed-secrets.yaml lo interpola dentro
# del SealedSecret de CADA tenant del cluster, cuyo nombre de Secret
# destino (tenant-<slug>-pushgateway-auth) cambia por tenant. Con el
# alcance por defecto, el mismo ciphertext repetido en varios tenants
# SOLO descifra para el primero que se selló — para los demás el
# controlador no descifra, el Secret nunca se crea, y el respaldo de esos
# tenants deja de correr en silencio. NO basta con repetir el comando de
# arriba "una vez por cada tenant": eso produce N ciphertexts para UNA
# ranura, y sigue sin resolver el problema.
#
# EL COMANDO CORRECTO usa `--scope cluster-wide` (no `--raw` a secas), UNA
# SOLA VEZ por cluster —no una vez por tenant—, y el SealedSecret que lo
# consume (tenant-template/templates/sealed-secrets.yaml, el octavo)
# lleva la anotación `sealedsecrets.bitnami.com/cluster-wide: "true"` que
# hace que el controlador descifre ese mismo ciphertext sin importar el
# namespace/nombre del Secret destino:
#
#   printf '' | kubeseal --raw \
#     --controller-namespace kube-system \
#     --scope cluster-wide \
#     --from-file=/dev/stdin
#
# En el hub, con el Pushgateway interno, el valor en claro se sella como
# CADENA VACÍA ("") — no hace falta ninguna contraseña real ahí. Este
# mismo ciphertext (uno solo) es el que reemplaza al placeholder de abajo
# para TODOS los tenants del cluster, presentes y futuros.
pushgatewayAuth: PLACEHOLDER_SIN_KUBESEAL_NO_ES_CIPHERTEXT_REAL_VER_COMENTARIO_DE_ARRIBA
